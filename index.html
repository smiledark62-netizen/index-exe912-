/* Layout: one narrow column, one screen at a time; strawberry-milk palette; stickers and hearts drift behind the cards */
:root {
  --bg: #fff1f4;
  --card: #ffffff;
  --paper: #fff8fa;
  --rule: #f8dde5;
  --fg: #3b1f26;
  --muted: #8a6670;
  --accent: #d42d55;
  --on-accent: #ffffff;
  --soft: #fbd3dc;
  --line: #f1cfd7;
  --heart: #e5385f;
  --font-display: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #24121a; --card: #331b25; --paper: #3a202b; --rule: #4a2a37; --fg: #fbe9ee; --muted: #c69aa8;
    --accent: #ff6b8b; --on-accent: #2a0f18; --soft: #4a2735; --line: #4d2b38; --heart: #ff6b8b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #24121a; --card: #331b25; --paper: #3a202b; --rule: #4a2a37; --fg: #fbe9ee; --muted: #c69aa8;
  --accent: #ff6b8b; --on-accent: #2a0f18; --soft: #4a2735; --line: #4d2b38; --heart: #ff6b8b;
  color-scheme: dark;
}
[hidden] { display: none !important; }
img { max-width: 100%; }
body { margin: 0; }
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 17px; line-height: 1.5;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#hearts, #stickers, #burst { position: fixed; inset: 0; overflow: hidden; pointer-events: none; }
#hearts { z-index: 0; }
#stickers { z-index: 0; }
#burst { z-index: 8; }
#hearts span {
  position: absolute; bottom: -40px; color: var(--heart); opacity: 0;
  animation: rise linear infinite;
}
@keyframes rise {
  0% { transform: translateY(0) translateX(0); opacity: 0; }
  10% { opacity: .35; }
  90% { opacity: .25; }
  100% { transform: translateY(-110vh) translateX(var(--drift, 20px)); opacity: 0; }
}
.st { position: absolute; width: var(--w, 70px); aspect-ratio: var(--ar, 1); background-repeat: no-repeat; background-position: center; background-size: contain; filter: drop-shadow(0 4px 8px rgba(120, 20, 50, .22)); animation: bobst 5s ease-in-out infinite; }

@keyframes bobst { 0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); } 50% { transform: translateY(-9px) rotate(calc(var(--r, 0deg) + 3deg)); } }
#burst span { position: absolute; color: var(--heart); animation: pop 1.5s ease-out forwards; opacity: 0; }
@keyframes pop {
  0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1); opacity: 0; }
}
main { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; min-height: calc(100vh - 80px); display: flex; flex-direction: column; justify-content: center; }
.screen { display: flex; flex-direction: column; gap: 18px; animation: fade .35s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 24px; padding: 22px;
  box-shadow: 0 10px 30px -18px rgba(180, 40, 80, .45);
  display: flex; flex-direction: column; gap: 16px; min-width: 0;
}
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
h1, h2 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--font-display); font-size: 38px; line-height: 1.1; font-weight: 900; font-style: italic; }
h2 { font-size: 26px; line-height: 1.2; font-weight: 800; }
p { margin: 0; color: var(--muted); }
.qe { width: 56px; height: 56px; display: grid; place-items: center; font-size: 30px; background: var(--soft); border-radius: 18px; animation: wob 2.4s ease-in-out infinite; }
@keyframes wob { 50% { transform: rotate(-7deg) scale(1.06); } }
.btn {
  appearance: none; border: 2px solid var(--accent); background: var(--accent); color: var(--on-accent);
  font: 800 17px var(--font-body); padding: 14px 22px; border-radius: 999px; cursor: pointer;
  transition: transform .12s ease, opacity .2s ease;
}
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .4; cursor: default; }
.btn.ghost { background: var(--bg); color: var(--accent); }
.letter .btn.ghost { background: var(--paper); }
.btn:focus-visible, .chip:focus-visible, .secret:focus-visible, .day:focus-visible, .env:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; }
.row > .btn { flex: 1 1 120px; }
.dots { display: flex; gap: 6px; }
.dots i { height: 6px; flex: 1; border-radius: 3px; background: var(--soft); }
.dots i.on { background: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 10px; }
.chip {
  appearance: none; font: 700 16px var(--font-body); color: var(--fg); background: transparent;
  border: 2px solid var(--line); border-radius: 999px; padding: 10px 18px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px; transition: transform .15s ease;
}
.chip .em { font-size: 20px; line-height: 1; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); transform: scale(1.05); }
input[type="text"], input[type="tel"] {
  font: 600 17px var(--font-body); color: var(--fg); background: var(--bg);
  border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; width: 100%;
}
input[type="text"]:focus, input[type="tel"]:focus { outline: none; border-color: var(--accent); }
/* color picker */
.swatch { display: flex; align-items: center; gap: 14px; }
.swatch .chipcolor { width: 64px; height: 64px; border-radius: 18px; border: 2px solid var(--line); flex: none; }
.swatch .hex { font: 800 22px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: .04em; }
.pad { position: relative; height: 180px; border-radius: 16px; touch-action: none; cursor: crosshair; border: 2px solid var(--line); }
.pad .thumb { position: absolute; width: 26px; height: 26px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 0 1.5px rgba(0,0,0,.45); transform: translate(-50%, -50%); pointer-events: none; }
input[type="range"] { width: 100%; height: 30px; -webkit-appearance: none; appearance: none; background: transparent; }
input[type="range"]::-webkit-slider-runnable-track { height: 14px; border-radius: 7px; background: var(--track, var(--soft)); }
input[type="range"]::-moz-range-track { height: 14px; border-radius: 7px; background: var(--track, var(--soft)); }
input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -8px; border-radius: 50%; background: var(--card); border: 4px solid var(--accent); }
input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--card); border: 4px solid var(--accent); }
.hue { --track: linear-gradient(to right, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00); }
/* letter screen */
.lettertop { text-align: center; display: flex; flex-direction: column; gap: 6px; }
.script2 { font-family: var(--font-display); font-size: 34px; line-height: 1.1; font-weight: 900; font-style: italic; color: var(--accent); text-wrap: balance; }
.env { position: relative; align-self: center; width: 280px; max-width: 100%; height: 190px; border: 0; padding: 0; margin: 28px 0 8px; background: transparent; cursor: pointer; animation: bob 3s ease-in-out infinite; filter: drop-shadow(0 14px 18px rgba(150, 30, 70, .28)); }
@keyframes bob { 50% { transform: translateY(-8px) rotate(-1deg); } }
.env.open { animation: none; }
.env > span { position: absolute; display: block; }
.eback { inset: 0; z-index: 0; border-radius: 14px; background: linear-gradient(160deg, var(--soft), var(--card)); border: 2px solid var(--accent); }
.epaper { left: 18px; right: 18px; top: 18px; bottom: 18px; z-index: 1; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; display: grid !important; place-items: center; color: var(--accent); font-size: 34px; transition: transform .7s cubic-bezier(.2, .8, .2, 1) .25s; }
.env.open .epaper { transform: translateY(-78px) scale(1.04); }
.efront { inset: 2px; z-index: 2; border-radius: 12px; background: var(--soft); clip-path: polygon(0 0, 50% 55%, 100% 0, 100% 100%, 0 100%); }
.eflap { left: 2px; right: 2px; top: 2px; height: 114px; z-index: 3; background: var(--accent); clip-path: polygon(0 0, 100% 0, 50% 100%); border-radius: 12px 12px 0 0; transform-origin: top; transition: transform .5s ease, z-index 0s .25s; }
.env.open .eflap { transform: rotateX(180deg); z-index: 0; }
.eseal { left: 50%; top: 84px; width: 46px; height: 46px; z-index: 4; border-radius: 50%; background: var(--card); color: var(--accent); display: grid !important; place-items: center; font-size: 22px; box-shadow: 0 4px 10px rgba(0, 0, 0, .22); transform: translateX(-50%); animation: beat 1.4s ease-in-out infinite; transition: opacity .25s ease; }
@keyframes beat { 50% { transform: translateX(-50%) scale(1.16); } }
.env.open .eseal { opacity: 0; animation: none; }
.eto { left: 0; right: 0; bottom: 14px; z-index: 3; text-align: center; font-family: var(--font-display); font-size: 20px; font-weight: 800; font-style: italic; color: var(--fg); }
/* invitation paper */
.letter {
  position: relative; background-color: var(--paper); border: 1px solid var(--line); border-radius: 20px;
  padding: 34px 22px 24px;
  background-image: repeating-linear-gradient(transparent 0, transparent 33px, var(--rule) 33px, var(--rule) 34px);
  box-shadow: 0 18px 34px -20px rgba(180, 40, 80, .6);
  transform: rotate(-1deg); display: flex; flex-direction: column; gap: 14px; min-width: 0;
  animation: letterin .7s cubic-bezier(.2, 1.1, .3, 1) both;
}

    $("bigtime").textContent = t; slot = t;
  }
  $("timerange").addEventListener("input", updateTime);

  var today = new Date(); today.setHours(0, 0, 0, 0);
  var tomorrow = new Date(today); tomorrow.setDate(today.getDate() + 1);
  var cal = { y: tomorrow.getFullYear(), m: tomorrow.getMonth() };
  function renderCal() {
    var g = $("calgrid"); g.textContent = "";
    DOW.forEach(function (d) { var e = document.createElement("div"); e.className = "dow"; e.textContent = d; g.appendChild(e); });
    $("calttl").textContent = cal.y + " · " + (cal.m + 1) + "-р сар";
    var first = new Date(cal.y, cal.m, 1);
    var lead = (first.getDay() + 6) % 7;
    for (var i = 0; i < lead; i++) { var pz = document.createElement("div"); pz.className = "day pad0"; g.appendChild(pz); }
    var days = new Date(cal.y, cal.m + 1, 0).getDate();
    for (var d = 1; d <= days; d++) {
      (function (day) {
        var dt = new Date(cal.y, cal.m, day);
        var b = document.createElement("button"); b.type = "button"; b.className = "day"; b.textContent = day;
        b.disabled = dt < tomorrow;
        var on = pickedDate && pickedDate.getTime() === dt.getTime();
        b.setAttribute("aria-pressed", on ? "true" : "false");
        b.addEventListener("click", function () { pickedDate = dt; $("nodone").disabled = false; renderCal(); });
        g.appendChild(b);
      })(d);
    }
    $("calprev").disabled = cal.y === tomorrow.getFullYear() && cal.m <= tomorrow.getMonth();
  }
  $("calprev").addEventListener("click", function () { cal.m--; if (cal.m < 0) { cal.m = 11; cal.y--; } renderCal(); });
  $("calnext").addEventListener("click", function () { cal.m++; if (cal.m > 11) { cal.m = 0; cal.y++; } renderCal(); });

  $("yesdone").addEventListener("click", function () { finish(); });
  $("nodone").addEventListener("click", function () {
    if (!pickedDate) return;
    $("nobox").hidden = true; $("yesbox").hidden = false;
    updateTime();
    var r = $("yesbox").getBoundingClientRect(); window.scrollTo(0, Math.max(0, window.scrollY + r.top - 80));
  });

  /* storage */
  var dbRef = null, remote = [], dbNote = "Онлайн хадгалалт: шалгаж байна…";
  function readLocal() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { return []; } }
  function writeLocal(list) { try { localStorage.setItem(LS_KEY, JSON.stringify(list)); } catch (e) {} }

  async function saveRemote(rec) {
    if (!dbRef) { dbNote = "Онлайн хадгалалт: байхгүй (зөвхөн энэ төхөөрөмжид хадгалагдсан)"; return; }
    try {
      await dbRef.doc("replies/" + rec.id).set(rec);
      dbNote = "Онлайн хадгалалт: ажиллаж байна";
    } catch (e) {
      dbNote = "Онлайн хадгалалт: бичиж чадсангүй (" + ((e && (e.code || e.message)) || "алдаа") + ")";
    }
    if (!$("admin").hidden) renderAdmin();
  }

  async function finish() {
    var rec = {
      id: "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
      at: new Date().toISOString(),
      snack: ans.snack || "", color: ans.color || "", season: ans.season || "",
      animal: ans.animal || "", icecream: ans.icecream || "",
      decision: decision,
      when: decision === "yes" ? slot : fmtDate(pickedDate) + " · " + slot
    };
    if (decision === "yes") {
      $("finalemoji").hidden = false; $("finalemoji").textContent = "🥰";
      $("finalline").textContent = "Маргааш уулзъя хөөрхнөө";
    } else {
      $("finalemoji").hidden = true;
      $("finalline").textContent = (pickedDate.getMonth() + 1) + "-р сарын " + pickedDate.getDate() + " өдөр уулзъя хөөрхнөө";
    }
    $("finalmeta").textContent = "🕰️ " + slot;
    show("s-final");
    burst(window.innerWidth / 2, 160, 28);
    var list = readLocal(); list.push(rec); writeLocal(list);
    await saveRemote(rec);
  }

  $("home").addEventListener("click", function () { resetAll(); show("s-intro"); });

  /* admin */
  function allRecords() {
    var map = {};
    readLocal().concat(remote).forEach(function (r) { if (r && r.id) map[r.id] = r; });
    return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return a.at < b.at ? 1 : -1; });
  }
  function row(dl, k, v, colorHex) {
    var dt = document.createElement("dt"); dt.textContent = k;
    var dd = document.createElement("dd");
    if (colorHex) { var dot = document.createElement("span"); dot.className = "dot"; dot.style.background = colorHex; dd.appendChild(dot); }
    dd.appendChild(document.createTextNode(v || "—"));
    dl.appendChild(dt); dl.appendChild(dd);
  }
  function renderAdmin() {
    var list = $("list"); list.textContent = "";
    var recs = allRecords();
    $("adminstatus").textContent = (recs.length ? recs.length + " хариулт · " : "") + dbNote;
    if (!recs.length) {
      var e = document.createElement("p"); e.textContent = "Одоогоор хариулт ирээгүй байна."; list.appendChild(e); return;
    }
    recs.forEach(function (r) {
      var c = document.createElement("div"); c.className = "rec";
      var top = document.createElement("div"); top.className = "top";
      var st = document.createElement("span"); st.className = "small"; st.textContent = fmtStamp(r.at);
      var pill = document.createElement("span"); pill.className = "pill" + (r.decision === "yes" ? "" : " no"); pill.textContent = r.decision === "yes" ? "YES" : "NO";
      top.appendChild(st); top.appendChild(pill); c.appendChild(top);
      var dl = document.createElement("dl"); dl.className = "kv"; dl.style.margin = "0";
      row(dl, "Snack", r.snack);
      row(dl, "Өнгө", (r.color || "").toUpperCase(), r.color);
      row(dl, "Улирал", r.season);
      row(dl, "Амьтан", r.animal);
      row(dl, "Зайрмаг", r.icecream);
      row(dl, r.decision === "yes" ? "Цаг" : "Өдөр", r.decision === "yes" ? "Маргааш " + r.when : r.when);
      c.appendChild(dl); list.appendChild(c);
    });
  }
  function openAdmin() {
    $("overlay").hidden = false; $("gate").hidden = false; $("admin").hidden = true;
    $("code").value = ""; setTimeout(function () { $("code").focus(); }, 50);
  }
  function closeAdmin() { $("overlay").hidden = true; }
  $("secret").addEventListener("click", openAdmin);
  $("close1").addEventListener("click", closeAdmin);
  $("close2").addEventListener("click", closeAdmin);
  $("overlay").addEventListener("click", function (e) { if (e.target === $("overlay")) closeAdmin(); });
  $("code").addEventListener("input", function () {
    var v = $("code").value.replace(/\D/g, "");
    $("code").value = v;
    if (v.length === 4) {
      if (v === ADMIN_CODE) { $("gate").hidden = true; $("admin").hidden = false; renderAdmin(); }
      else {
        $("code").classList.remove("shake"); void $("code").offsetWidth; $("code").classList.add("shake");
        setTimeout(function () { $("code").value = ""; }, 300);
      }
    }
  });

  /* online store, optional */
  (async function () {
    try {
      if (!window.claude || !window.claude.use) { dbNote = "Онлайн хадгалалт: байхгүй (зөвхөн энэ төхөөрөмжид хадгалагдсан)"; return; }
      var db = await window.claude.use("db");
      if (!db) { dbNote = "Онлайн хадгалалт: байхгүй (зөвхөн энэ төхөөрөмжид хадгалагдсан)"; return; }
      dbRef = db; dbNote = "Онлайн хадгалалт: холбогдсон";
      db.collection("replies").onSnapshot(function (snap) {
        remote = [];
        snap.docs.forEach(function (d) { var data = d.data(); if (data && data.id) remote.push(data); });
        if (!$("admin").hidden) renderAdmin();
      }, function () {});
    } catch (e) { dbNote = "Онлайн хадгалалт: алдаа"; }
  })();

  resetAll();
})();
</script>

</body>
</html>
